
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LEVELING" />
    <meta name="description" content="System Interface for Real-Life Leveling" />
    
    <title>LEVELING: System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Rajdhani', sans-serif;
        background-color: #000000;
        color: #e2e8f0;
        overflow-x: hidden;
        -webkit-tap-highlight-color: transparent; /* Removes tap highlight on mobile */
        user-select: none; /* Prevent text selection during hold interactions */
        overscroll-behavior-y: none; /* Prevent pull-to-refresh on mobile */
      }
      
      /* Safe Area Padding for iPhone Notch */
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom);
      }
      .pt-safe {
        padding-top: env(safe-area-inset-top);
      }

      /* Solo Leveling Blue Glows */
      .system-glow {
        box-shadow: 0 0 15px rgba(37, 99, 235, 0.2), inset 0 0 20px rgba(37, 99, 235, 0.1);
        border: 1px solid rgba(59, 130, 246, 0.5);
      }
      .system-text-shadow {
        text-shadow: 0 0 5px rgba(56, 189, 248, 0.8);
      }
      
      /* Scrollbar Hiding */
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }

      /* Animations */
      @keyframes pulse-border {
        0% { border-color: rgba(56, 189, 248, 0.3); box-shadow: 0 0 5px rgba(56, 189, 248, 0.2); }
        50% { border-color: rgba(56, 189, 248, 0.8); box-shadow: 0 0 15px rgba(56, 189, 248, 0.5); }
        100% { border-color: rgba(56, 189, 248, 0.3); box-shadow: 0 0 5px rgba(56, 189, 248, 0.2); }
      }
      .animate-pulse-border {
        animation: pulse-border 2s infinite;
      }

      /* CRT Turn Off Animation */
      @keyframes turn-off {
        0% { transform: scale(1, 1.3) translate3d(0, 0, 0); filter: brightness(1); opacity: 1; }
        60% { transform: scale(1, 0.001) translate3d(0, 0, 0); filter: brightness(10); }
        100% { animation-timing-function: cubic-bezier(0.755, 0.05, 0.855, 0.06); transform: scale(0, 0.001) translate3d(0, 0, 0); opacity: 0; }
      }
      .animate-turn-off {
        animation: turn-off 0.55s cubic-bezier(0.23, 1, 0.32, 1) forwards;
      }

      /* CRT Turn On Animation */
      @keyframes turn-on {
        0% { transform: scale(0, 0.001) translate3d(0, 0, 0); opacity: 0; filter: brightness(30); }
        60% { transform: scale(1, 0.001) translate3d(0, 0, 0); opacity: 1; filter: brightness(10); }
        100% { transform: scale(1, 1) translate3d(0, 0, 0); opacity: 1; filter: brightness(1); }
      }
      .animate-turn-on {
        animation: turn-on 0.4s cubic-bezier(0.23, 1, 0.32, 1) forwards;
      }

      /* Glitch Effect */
      .glitch {
        position: relative;
      }
      .glitch::before,
      .glitch::after {
        content: attr(data-text);
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
      .glitch::before {
        left: 2px;
        text-shadow: -1px 0 red;
        clip: rect(44px, 450px, 56px, 0);
        animation: glitch-anim-1 5s infinite linear alternate-reverse;
      }
      .glitch::after {
        left: -2px;
        text-shadow: -1px 0 blue;
        clip: rect(44px, 450px, 56px, 0);
        animation: glitch-anim-2 5s infinite linear alternate-reverse;
      }
      @keyframes glitch-anim-1 {
        0% { clip: rect(20px, 9999px, 81px, 0); }
        20% { clip: rect(68px, 9999px, 7px, 0); }
        40% { clip: rect(10px, 9999px, 86px, 0); }
        60% { clip: rect(45px, 9999px, 15px, 0); }
        80% { clip: rect(62px, 9999px, 35px, 0); }
        100% { clip: rect(33px, 9999px, 49px, 0); }
      }
      @keyframes glitch-anim-2 {
        0% { clip: rect(50px, 9999px, 61px, 0); }
        20% { clip: rect(15px, 9999px, 87px, 0); }
        40% { clip: rect(2px, 9999px, 1px, 0); }
        60% { clip: rect(78px, 9999px, 25px, 0); }
        80% { clip: rect(12px, 9999px, 95px, 0); }
        100% { clip: rect(33px, 9999px, 19px, 0); }
      }

      /* Particles */
      .particle {
        position: absolute;
        width: 4px;
        height: 4px;
        background: #fbbf24;
        border-radius: 50%;
        pointer-events: none;
        animation: rise 1s ease-out forwards;
      }
      @keyframes rise {
        0% { transform: translateY(0) scale(1); opacity: 1; }
        100% { transform: translateY(-100px) scale(0); opacity: 0; }
      }

      /* Slam Text Animation */
      @keyframes slam {
        0% { transform: scale(3); opacity: 0; }
        50% { transform: scale(1); opacity: 1; }
        60% { transform: scale(1.1); }
        100% { transform: scale(1); }
      }
      .animate-slam {
        animation: slam 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }

      /* Shine Effect for Items */
      @keyframes shine {
        0% { left: -100%; }
        100% { left: 200%; }
      }
      .animate-shine {
        animation: shine 2s infinite linear;
      }

      /* Ticker */
      @keyframes ticker {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }
      .animate-ticker {
        animation: ticker 40s linear infinite;
      }

      /* Screen Shake */
      @keyframes shake {
        0% { transform: translate(1px, 1px) rotate(0deg); }
        10% { transform: translate(-1px, -2px) rotate(-1deg); }
        20% { transform: translate(-3px, 0px) rotate(1deg); }
        30% { transform: translate(3px, 2px) rotate(0deg); }
        40% { transform: translate(1px, -1px) rotate(1deg); }
        50% { transform: translate(-1px, 2px) rotate(-1deg); }
        60% { transform: translate(-3px, 1px) rotate(0deg); }
        70% { transform: translate(3px, 1px) rotate(-1deg); }
        80% { transform: translate(-1px, -1px) rotate(1deg); }
        90% { transform: translate(1px, 2px) rotate(0deg); }
        100% { transform: translate(1px, -2px) rotate(-1deg); }
      }
      .animate-shake {
        animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both;
      }

      /* Floating Damage Text */
      @keyframes float-up-fade {
        0% { transform: translateY(0) scale(1); opacity: 1; }
        100% { transform: translateY(-50px) scale(1.5); opacity: 0; }
      }
      .floating-text {
        position: absolute;
        pointer-events: none;
        animation: float-up-fade 1s ease-out forwards;
        font-weight: 900;
        font-family: 'Courier New', Courier, monospace;
        text-shadow: 2px 2px 0px black;
      }

    </style>
